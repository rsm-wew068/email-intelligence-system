<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="300" rx="8" fill="#ffffff" />
  <defs>
    <marker id="arrow-blk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827" />
    </marker>
    <marker id="arrow-hitl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309" />
    </marker>
  </defs>

  <!-- Human-in-the-Loop Gates -->
  <rect x="365" y="14" width="160" height="46" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="445" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Human Approval</text>
  <text x="445" y="50" text-anchor="middle" font-size="12" fill="#92400e">Merge / Date Shift</text>
  <line x1="445" y1="60" x2="445" y2="104" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-hitl)" />

  <rect x="738" y="14" width="164" height="46" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="820" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Human Approval</text>
  <text x="820" y="50" text-anchor="middle" font-size="12" fill="#92400e">Edit &amp; Approve Send</text>
  <line x1="820" y1="60" x2="820" y2="104" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-hitl)" />

  <!-- Input -->
  <rect x="16" y="110" width="135" height="80" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="83" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Raw Emails</text>
  <text x="83" y="165" text-anchor="middle" font-size="12" fill="#4b5563">Paste or .eml</text>

  <line x1="151" y1="150" x2="177" y2="150" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow-blk)" />

  <!-- Stage 1 -->
  <rect x="182" y="110" width="155" height="80" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="259" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">1. Inbox</text>
  <text x="259" y="158" text-anchor="middle" font-size="12" fill="#4b5563">Extract tasks &amp;</text>
  <text x="259" y="174" text-anchor="middle" font-size="12" fill="#4b5563">verify quotes</text>

  <line x1="337" y1="150" x2="363" y2="150" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow-blk)" />

  <!-- Stage 2 -->
  <rect x="368" y="110" width="155" height="80" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="445" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">2. Tasks</text>
  <text x="445" y="158" text-anchor="middle" font-size="12" fill="#4b5563">Deduplicate &amp;</text>
  <text x="445" y="174" text-anchor="middle" font-size="12" fill="#4b5563">resolve conflicts</text>

  <line x1="523" y1="150" x2="549" y2="150" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow-blk)" />

  <!-- Stage 3 -->
  <rect x="554" y="110" width="155" height="80" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="631" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">3. Org Graph</text>
  <text x="631" y="158" text-anchor="middle" font-size="12" fill="#4b5563">Rank influencers</text>
  <text x="631" y="174" text-anchor="middle" font-size="12" fill="#4b5563">&amp; bottlenecks</text>

  <line x1="709" y1="150" x2="735" y2="150" stroke="#111827" stroke-width="1.5" marker-end="url(#arrow-blk)" />

  <!-- Stage 4 -->
  <rect x="740" y="110" width="160" height="80" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="820" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">4. AI Assistant</text>
  <text x="820" y="158" text-anchor="middle" font-size="12" fill="#4b5563">Query tools &amp;</text>
  <text x="820" y="174" text-anchor="middle" font-size="12" fill="#4b5563">draft follow-ups</text>

  <!-- Closed Loop Return -->
  <path d="M 820 190 L 820 248 L 259 248 L 259 195" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-blk)" />
  <text x="540" y="268" text-anchor="middle" font-size="12" fill="#4b5563">
    Closed Loop: Dispatched follow-up emails log back into Inbox &amp; Org Graph
  </text>
</svg>
