<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 565" width="920" height="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="565" rx="8" fill="#ffffff" />
  <defs>
    <marker id="a-blk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111827" />
    </marker>
    <marker id="a-hitl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309" />
    </marker>
  </defs>

  <!-- 1. Frontend Box -->
  <rect x="40" y="16" width="840" height="68" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="460" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">
    Frontend Web App (ES6 + HTML5 Canvas)
  </text>
  <text x="460" y="62" text-anchor="middle" font-size="12" fill="#4b5563">
    Inbox &bull; Tasks (List / Board / Gantt) &bull; Org Graph &bull; AI Assistant
  </text>

  <!-- Frontend <-> Backend Arrows -->
  <line x1="280" y1="84" x2="280" y2="126" stroke="#111827" stroke-width="1.5" marker-end="url(#a-blk)" />
  <text x="268" y="110" text-anchor="end" font-size="12" fill="#374151">Ingest Email</text>

  <line x1="640" y1="90" x2="640" y2="126" stroke="#111827" stroke-width="1.5" marker-start="url(#a-blk)" marker-end="url(#a-blk)" />
  <text x="652" y="110" text-anchor="start" font-size="12" fill="#374151">REST JSON &amp; Approvals</text>

  <!-- Outer Backend Boundary -->
  <rect x="40" y="132" width="840" height="330" rx="6" fill="#fafafa" stroke="#111827" stroke-width="1.75" />
  <text x="60" y="155" font-size="12" font-weight="700" fill="#111827">FastAPI Backend (Google Cloud Run)</text>

  <!-- 2. Extraction & Guardrail Pipeline -->
  <rect x="65" y="168" width="790" height="88" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.25" />
  <text x="85" y="190" font-size="12" font-weight="700" fill="#111827">Extraction &amp; Guardrail Pipeline (extractor.py)</text>

  <rect x="85" y="203" width="165" height="38" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.25" />
  <text x="167" y="226" text-anchor="middle" font-size="12" fill="#111827">1. Prompt Sandbox</text>
  <line x1="250" y1="222" x2="274" y2="222" stroke="#111827" stroke-width="1.5" marker-end="url(#a-blk)" />

  <rect x="279" y="203" width="185" height="38" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.25" />
  <text x="371" y="226" text-anchor="middle" font-size="12" fill="#111827">2. Vertex AI Gemini 3.8</text>
  <line x1="464" y1="222" x2="488" y2="222" stroke="#111827" stroke-width="1.5" marker-end="url(#a-blk)" />

  <rect x="493" y="203" width="155" height="38" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.25" />
  <text x="570" y="226" text-anchor="middle" font-size="12" fill="#111827">3. Pydantic Schema</text>
  <line x1="648" y1="222" x2="672" y2="222" stroke="#111827" stroke-width="1.5" marker-end="url(#a-blk)" />

  <rect x="677" y="203" width="160" height="38" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="757" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">4. Quote Verifier</text>

  <!-- Straight Vertical Feeds -->
  <line x1="185" y1="256" x2="185" y2="295" stroke="#111827" stroke-width="1.5" marker-end="url(#a-blk)" />
  <text x="195" y="280" font-size="12" fill="#374151">Verified Tasks</text>

  <line x1="735" y1="256" x2="735" y2="295" stroke="#111827" stroke-width="1.5" marker-end="url(#a-blk)" />
  <text x="725" y="280" text-anchor="end" font-size="12" fill="#374151">Verified Entities</text>

  <!-- 3. Three Shared Core Engines -->
  <rect x="65" y="300" width="240" height="84" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="185" y="327" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Schedule &amp; Deduplication</text>
  <text x="185" y="347" text-anchor="middle" font-size="12" fill="#4b5563">Task similarity check &amp;</text>
  <text x="185" y="364" text-anchor="middle" font-size="12" fill="#4b5563">overlap solver (.ics / CSV)</text>

  <line x1="311" y1="342" x2="334" y2="342" stroke="#111827" stroke-width="1.5" marker-start="url(#a-blk)" marker-end="url(#a-blk)" />

  <rect x="340" y="300" width="240" height="84" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="460" y="327" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Multi-Tool AI Agent</text>
  <text x="460" y="347" text-anchor="middle" font-size="12" fill="#4b5563">6 live graph &amp; schedule tools</text>
  <text x="460" y="364" text-anchor="middle" font-size="12" fill="#4b5563">+ follow-up email drafter</text>

  <line x1="586" y1="342" x2="609" y2="342" stroke="#111827" stroke-width="1.5" marker-start="url(#a-blk)" marker-end="url(#a-blk)" />

  <rect x="615" y="300" width="240" height="84" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="735" y="327" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">NetworkX Org Graph</text>
  <text x="735" y="347" text-anchor="middle" font-size="12" fill="#4b5563">PageRank, Betweenness &amp;</text>
  <text x="735" y="364" text-anchor="middle" font-size="12" fill="#4b5563">temporal date slicing</text>

  <!-- Human-in-the-Loop Gate -->
  <line x1="185" y1="384" x2="185" y2="404" stroke="#b45309" stroke-width="1.5" marker-end="url(#a-hitl)" />
  <line x1="460" y1="384" x2="460" y2="404" stroke="#b45309" stroke-width="1.5" marker-end="url(#a-hitl)" />

  <rect x="65" y="410" width="790" height="36" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="460" y="433" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">
    Human-in-the-Loop Approval Gate: Merge Duplicate &bull; Shift / Reassign Schedule &bull; Send Email
  </text>

  <!-- 4. CI/CD Pipeline -->
  <rect x="40" y="490" width="840" height="54" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <text x="460" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">
    CI/CD &amp; Evaluation Pipeline
  </text>
  <text x="460" y="530" text-anchor="middle" font-size="12" fill="#4b5563">
    GitHub main &rarr; GitHub Actions (pytest + Ablation Suite) &rarr; Keyless GCP OIDC &rarr; Google Cloud Run
  </text>
  <line x1="460" y1="490" x2="460" y2="467" stroke="#111827" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-blk)" />
</svg>
